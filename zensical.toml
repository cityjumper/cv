[project]
site_name = "Gareth Thomas — CV"
site_description = "CV of Gareth Thomas — consultant, technologist, and two-time founder based in Eindhoven, Netherlands."
site_author = "Gareth Thomas"
site_url = "https://cityjumper.github.io/cv/"

copyright = """
Copyright &copy; 2026 Gareth Thomas
"""

repo_url = "https://github.com/cityjumper/cv"
repo_name = "cityjumper/cv"

nav = [
  { "Home" = "index.md" },
  { "Experience" = "experience.md" },
  { "Skills" = "skills.md" },
  { "Education" = "education.md" },
  { "Timeline" = "timeline.md" },
  { "Events Organized" = "events.md" },
  { "Podcast Episodes" = "podcast.md" },
  { "Talks Given" = "talks.md" },
  { "Network" = "network.md" },
  { "Hobbies" = "hobbies.md" },
  { "Languages" = "languages.md" },
]

[project.theme]
language = "en"

features = [
  "content.tooltips",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "navigation.footer",
  "navigation.indexes",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://nl.linkedin.com/in/g-thomas"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/cityjumper/cv"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:gareth.bj.thomas@gmail.com"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tilde]
